<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逗點教室 — 分校固定支出控管</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F7FA;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;min-height:100vh}
.app{padding:24px;max-width:1100px;margin:0 auto}

/* top bar */
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.top-bar h1{font-size:17px;font-weight:700;color:#0A1628;letter-spacing:.01em}
.top-bar .sub{font-size:12px;color:#6B7280;margin-top:3px}
.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}

/* form elements */
select,button{font-family:inherit;cursor:pointer;outline:none}
.msel{font-size:13px;padding:6px 10px;border:1px solid #D1D5DB;border-radius:6px;background:#fff;color:#111827}
.msel:focus{border-color:#1B4FBF}
.vtog{display:flex;border:1px solid #D1D5DB;border-radius:6px;overflow:hidden;background:#fff}
.vtog button{padding:5px 13px;font-size:12px;border:none;background:transparent;color:#6B7280;transition:all .15s}
.vtog button.on{background:#0A1628;color:#fff}
.ebtn{font-size:12px;padding:6px 12px;border:1px solid #D1D5DB;border-radius:6px;background:#fff;color:#374151}
.ebtn:hover{background:#F3F4F6;border-color:#9CA3AF}

/* summary cards */
.sm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
@media(max-width:600px){.sm-grid{grid-template-columns:repeat(2,1fr)}}
.mc{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mc .lbl{font-size:10px;color:#9CA3AF;margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.mc .val{font-size:22px;font-weight:700;color:#111827}
.mc .sub{font-size:11px;color:#9CA3AF;margin-top:3px}
.mc.ok .val{color:#059669}.mc.warn .val{color:#D97706}.mc.danger .val{color:#DC2626}

/* branch tabs */
.tab-row{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap}
.tbtn{padding:6px 14px;font-size:13px;border:1px solid #E5E7EB;border-radius:6px;background:#fff;color:#6B7280;display:flex;align-items:center;gap:5px;transition:all .15s}
.tbtn.on{background:#0A1628;border-color:#0A1628;color:#fff;font-weight:500}
.tbtn:hover:not(.on){background:#F9FAFB;color:#111827}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dg{background:#059669}.da{background:#D97706}.dr{background:#DC2626}

/* table */
.tw{overflow-x:auto;border:1px solid #E5E7EB;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.04)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-size:10px;font-weight:700;color:#9CA3AF;padding:10px 12px;border-bottom:1px solid #E5E7EB;text-align:center;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;background:#F9FAFB}
thead th.tl{text-align:left}
tbody tr:hover{background:#F9FAFB}
tbody td{padding:9px 12px;border-bottom:1px solid #F3F4F6;text-align:center;vertical-align:middle}
tbody td.tl{text-align:left;color:#111827}
tbody tr:last-child td{border-bottom:none}
.cat-row td{background:#EEF2FF;font-size:10px;font-weight:700;color:#1B4FBF;text-align:left;padding:6px 14px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #E5E7EB}

/* check icon */
.ck{font-size:18px;cursor:pointer;user-select:none;display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;transition:background .1s}
.ck:hover{background:#F3F4F6}
.due-inp{width:100%;border:1px solid #C0392B;border-radius:5px;padding:4px 6px;font-size:12px;font-family:inherit;background:#C0392B;color:#fff;outline:none;cursor:pointer;font-weight:500}
.due-inp:focus{background:#162850;border-color:#0A1628}
.pay-inp{width:100%;border:1px solid #C0392B;border-radius:5px;padding:4px 6px;font-size:12px;font-family:inherit;background:#C0392B;color:#fff;outline:none;cursor:pointer;font-weight:500}
.pay-inp:focus{background:#162850;border-color:#0A1628}
tr.paid-row .due-inp,tr.paid-row .pay-inp{background:#0A1628;border-color:#0A1628;color:#fff}
.ck.paid{color:#059669}.ck.unpaid{color:#D1D5DB}

/* amount input */
.amt-inp{width:95px;background:transparent;border:none;border-bottom:1px solid #E5E7EB;font-size:13px;color:#1B4FBF;padding:3px 4px;text-align:right;outline:none;font-family:inherit}
.amt-inp:focus{border-bottom-color:#1B4FBF;color:#0A1628}
.amt-inp::placeholder{color:#D1D5DB;font-size:12px}

/* note */
.note-wrap{position:relative}
.note-disp{font-size:11px;color:#9CA3AF;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;padding:3px 2px;border-bottom:1px solid transparent}
.note-disp:hover{color:#374151;border-bottom-color:#D1D5DB}
.note-inp-field{width:100%;background:transparent;border:none;border-bottom:1px solid #1B4FBF;font-size:11px;color:#111827;padding:3px 2px;outline:none;font-family:inherit;display:none}

/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
.bc{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:16px;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.bc:hover{border-color:#0A1628;box-shadow:0 2px 8px rgba(10,22,40,.08)}
.bc-name{font-size:13px;font-weight:600;color:#0A1628;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bc-name svg{opacity:.4;flex-shrink:0}
.bc-pct{font-size:24px;font-weight:700;margin-bottom:3px;display:flex;align-items:baseline;gap:8px}
.bc-sub{font-size:11px;color:#9CA3AF;margin-bottom:8px}
.pb-wrap{background:#F3F4F6;border-radius:3px;height:4px;overflow:hidden}
.pb{height:4px;border-radius:3px;transition:width .5s}
.bc-amt{font-size:11px;color:#1B4FBF;margin-top:7px;font-weight:500}
.badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500}
.bok{background:#D1FAE5;color:#065F46}
.bwarn{background:#FEF3C7;color:#92400E}
.bdanger{background:#FEE2E2;color:#991B1B}
.save-btn{font-size:12px;padding:6px 14px;border:1px solid #0A1628;border-radius:6px;background:#0A1628;color:#fff;cursor:pointer;transition:all .2s}
.save-btn:hover{background:#162850}
.save-btn.saving{background:#6B7280;border-color:#6B7280}
.save-btn.saved{background:#059669;border-color:#059669}

.alert-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:none}
.alert-box .alert-title{font-size:13px;font-weight:600;color:#991B1B;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.alert-box .alert-items{display:flex;flex-wrap:wrap;gap:6px}
.alert-tag{font-size:11px;padding:3px 10px;background:#FEE2E2;color:#991B1B;border-radius:20px;white-space:nowrap}
tbody tr.unpaid-row td{background:#FFF5F5}
tbody tr.unpaid-row:hover td{background:#FEE2E2}
tbody tr.unpaid-row.paid-row td{background:#0A1628}
</style>
</head>

      {c:'水電費',    n:'2樓電費',             p:[1,1,1,0], note:'電費3月帳單已繳（區間115.1/19~115.3/19）',  amt:[null,null,null,null]},
      {c:'水電費',    n:'3樓電費',             p:[1,1,1,0], note:'電費3月帳單已繳（區間115.1/19~115.3/19）',  amt:[null,null,null,null]},
      {c:'電信費',    n:'中華電信網路費',      p:[1,1,1,0], note:'4月份帳單已收到，5/25去補繳',               amt:[null,null,null,null]},
      {c:'電信費',    n:'中華電信電話費',      p:[1,1,1,1], note:'4月份帳單，5/4已繳納',                       amt:[null,null,null,null]},
      {c:'電信費',    n:'毅通網路電話費',      p:[1,1,1,1], note:'4月份帳單，5/4已繳納',                       amt:[null,null,null,null]},
      {c:'影印費',    n:'影印機費用',          p:[1,1,1,0], note:'1~3月一期，3/24上ERP，4/2出帳給廠商',        amt:[null,null,null,null]},
      {c:'房租',      n:'每月升大校房租',      p:[1,1,1,1], note:'',                                           amt:[null,null,null,null]},

      {c:'勞工相關',  n:'健保費',              p:[1,1,1,0], note:'升大無紀錄，1~2月已向人資確認',              amt:[null,null,null,null]},
      {c:'勞工相關',  n:'勞退費',              p:[1,1,1,0], note:'升大無紀錄，1~2月已向人資確認',              amt:[null,null,null,null]},

const BRANCHES = Object.keys(BD);
let curB = BRANCHES[0], curM = CUR_M, curV = 'd';
let OV = {};
let GAS_READY = false;
async function gasLoad(){
  try{
    const r=await fetch(GAS_URL, {redirect:'follow'});
    const text=await r.text();
    let d;
    try{ d=JSON.parse(text); }catch(e){ console.log('parse err',text.slice(0,200)); return; }
    function cleanVal(v){
      if(!v && v!==0) return '';
      const s=String(v);
      // 日期格式 2026-05-26T16:00:00.000Z -> 2026-05-26
      if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.slice(0,10);
      return s;
    }
    if(Array.isArray(d)){
      d.forEach(row=>{ if(row[0]) OV[String(row[0])]=cleanVal(row[1]); });
    } else if(typeof d==='object' && d!==null){
      Object.keys(d).forEach(k=>{ OV[k]=cleanVal(d[k]); });
    }
    console.log('loaded OV keys:', Object.keys(OV).length);
    GAS_READY=true;
  }catch(e){console.log('load err',e);}
}
async function gasSet(key,value){
  try{
    await fetch(GAS_URL,{method:'POST',body:JSON.stringify({key,value}),headers:{'Content-Type':'text/plain'}});
  }catch(e){console.log('save err',e);}
  return true;
}

function sk(b,mi,n){ return b+'§'+mi+'§'+n }
function isPaid(b,mi,n){
  const k=sk(b,mi,n);
  if(OV[k]!==undefined) return OV[k];
  const d=BD[b]; const li=d.mo.indexOf(mi);
  if(li<0) return false;
  const it=d.items.find(x=>x.n===n);
  return it ? !!it.p[li] : false;
}
function getAmt(b,mi,n){
  const k='a§'+sk(b,mi,n);
  if(OV[k]!==undefined){ const v=parseInt(String(OV[k]).replace(/[^0-9]/g,'')); return isNaN(v)?null:v; }
  const d=BD[b]; const li=d.mo.indexOf(mi);
  if(li<0) return null;
  const it=d.items.find(x=>x.n===n);
  return it ? it.amt[li] : null;
}
function getNote(b,mi,n){
  const k='nt§'+sk(b,mi,n);
  if(OV[k]!==undefined) return OV[k];
  const it=BD[b].items.find(x=>x.n===n);
  return it ? it.note : '';
}
function toggle(b,mi,n){ const k=sk(b,mi,n); OV[k]=!isPaid(b,mi,n); gasSet(k,OV[k]?'1':'0'); render(); }
function saveAmt(b,mi,n,v){ const k='a§'+sk(b,mi,n); const parsed=parseInt(String(v).replace(/[^0-9]/g,'')); const val=(v===''||v===null||isNaN(parsed))?null:parsed; OV[k]=val; gasSet(k,val===null?'':String(val)); renderSm(); }
function saveNote(b,mi,n,v){ const k='nt§'+sk(b,mi,n); OV[k]=v; gasSet(k,v); }

function getDue(b,mi,n){ return OV['du§'+sk(b,mi,n)]||''; }
function saveDue(b,mi,n,v){ const k='du§'+sk(b,mi,n); OV[k]=v; gasSet(k,v); }
function getPayDate(b,mi,n){ return OV['pd§'+sk(b,mi,n)]||''; }
function savePayDate(b,mi,n,v){ const k='pd§'+sk(b,mi,n); OV[k]=v; gasSet(k,v); }
function dueStatus(v){
  if(!v) return '';
  const d=new Date(v),now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.round((d-now)/(1000*60*60*24));
  if(diff<0) return 'overdue';
  if(diff<=3) return 'soon';
  return 'ok';
}
function fmtAmt(v){ return (v==null||v==='')?'':Number(v).toLocaleString(); }
function stats(b,mi){
  const its=BD[b].items; let p=0,t=its.length,s=0;
  its.forEach(it=>{ if(isPaid(b,mi,it.n)){p++; const a=getAmt(b,mi,it.n); if(a) s+=a; } });
  return {p,t,pct:Math.round(p/t*100),sum:s};
}
function allStats(mi){
  let u=0,t=0,s=0;
  BRANCHES.forEach(b=>{ const st=stats(b,mi); u+=(st.t-st.p); t+=st.t; s+=st.sum; });
  return {u,t,s};
}
function pCol(p){ return p===100?'#0DBF7A':p>=70?'#F5A623':'#E8415A'; }
function dotCls(p){ return p===100?'dg':p>=70?'da':'dr'; }
function bCls(p){ return p===100?'bok':p>=70?'bwarn':'bdanger'; }
function bTxt(p){ return p===100?'完成':p>=70?'部分待繳':'需注意'; }

function setView(v){
  curV=v;
  document.getElementById('dv').style.display=v==='d'?'':'none';
  document.getElementById('ov').style.display=v==='o'?'':'none';
  document.getElementById('btnD').classList.toggle('on',v==='d');
  document.getElementById('btnO').classList.toggle('on',v==='o');
  if(v==='o') renderOv();
}

function renderMsel(){
  const s=document.getElementById('msel'); s.innerHTML='';
  MO_TXT.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent='115年 '+m; if(i===curM)o.selected=true; s.appendChild(o); });
  s.onchange=()=>{ curM=parseInt(s.value); render(); };
}

function renderTabs(){
  const el=document.getElementById('tabs'); el.innerHTML='';
  BRANCHES.forEach(b=>{
    const s=stats(b,curM);
    const btn=document.createElement('button'); btn.className='tbtn'+(b===curB?' on':'');
    btn.innerHTML=b+' <span class="dot '+dotCls(s.pct)+'"></span>';
    btn.onclick=()=>{ curB=b; renderTabs(); renderTable(); renderSm(); };
    el.appendChild(btn);
  });
}

function renderSm(){
  const a=allStats(curM), br=stats(curB,curM);
  document.getElementById('smCards').innerHTML=
    '<div class="mc '+(a.u===0?'ok':a.u<=8?'warn':'danger')+'"><div class="lbl">全校區未繳</div><div class="val">'+a.u+' 項</div></div>'+
    '<div class="mc"><div class="lbl">已繳金額合計</div><div class="val">'+(a.s>0?'$'+a.s.toLocaleString():'-')+'</div><div class="sub">本月已輸入金額</div></div>'+
    '<div class="mc '+(br.pct===100?'ok':br.pct>=70?'warn':'danger')+'"><div class="lbl">'+curB+' 完成率</div><div class="val">'+br.pct+'%</div></div>'+
    '<div class="mc"><div class="lbl">'+curB+' 已繳</div><div class="val">'+br.p+'/'+br.t+'</div><div class="sub">'+(br.sum>0?'已繳 $'+br.sum.toLocaleString():'')+'</div></div>';
}

function renderTable(){
  const mi=curM, bd=BD[curB];
  document.getElementById('th').innerHTML=
    '<th class="tl" style="min-width:60px;padding-left:12px">類別</th>'+
    '<th class="tl" style="min-width:140px">項目</th>'+
    '<th style="min-width:60px">狀態</th>'+
    '<th style="min-width:110px">截止日</th>'+'<th style="min-width:110px">繳費日期</th>'+'<th style="min-width:100px">金額（元）</th>'+
    '<th class="tl" style="min-width:180px">備註</th>';

  const tb=document.getElementById('tb'); tb.innerHTML='';
  let lastC='';
  bd.items.forEach((it,idx)=>{
    if(it.c!==lastC){
      const r=document.createElement('tr'); r.className='cat-row';
      r.innerHTML='<td colspan="7">'+it.c+'</td>';
      tb.appendChild(r); lastC=it.c;
    }
    const paid=isPaid(curB,mi,it.n);
    const amt=getAmt(curB,mi,it.n);
    const note=getNote(curB,mi,it.n);
    const sid='s'+idx+'_'+mi;

    const tr=document.createElement('tr');
    tr.className=paid?'paid-row':'unpaid-row';
    tr.innerHTML=
      '<td class="tl" style="padding-left:16px;color:#2A4060;font-size:12px"></td>'+
      '<td class="tl">'+it.n+'</td>'+
      '<td><span class="ck '+(paid?'paid':'unpaid')+'" id="ck_'+sid+'">'+(paid?'✓':'○')+'</span></td>'+
      '<td id="due_td_'+sid+'">'+'<input type="date" class="due-inp" id="due_'+sid+'" value="">'+'</td>'+
      '<td>'+'<input type="date" class="pay-inp" id="pay_'+sid+'" value="">'+'</td>'+
      '<td><input class="amt-inp" type="text" value="'+fmtAmt(amt)+'" placeholder="輸入金額" id="amt_'+sid+'"></td>'+
      '<td><div class="note-wrap"><div class="note-disp" id="nd_'+sid+'">'+(note||'<span style="color:#2A4060">點擊新增…</span>')+'</div><input class="note-inp-field" id="ni_'+sid+'" value="'+note+'" placeholder="新增備註…"></div></td>';

    // wire events after appending
    const bName=curB, iName=it.n;
    tr.querySelector('#ck_'+sid).onclick=()=>{ toggle(bName,mi,iName); };
    const amtInp=tr.querySelector('#amt_'+sid);
    amtInp.onblur=()=>{ const raw=amtInp.value.replace(/[^0-9]/g,''); const v=raw===''?null:parseInt(raw); amtInp.value=v===null?'':(v===0?'0':v.toLocaleString()); saveAmt(bName,mi,iName,v===null?'':String(v)); if(v===0&&!isPaid(bName,mi,iName)){ toggle(bName,mi,iName); } };
    const dueInp=tr.querySelector('#due_'+sid);
    if(dueInp){
      // 加確認鈕

      dueInp.value=getDue(bName,mi,iName); ['change','input','blur'].forEach(ev=>dueInp.addEventListener(ev,()=>{
      if(!dueInp.value) return;
      saveDue(bName,mi,iName,dueInp.value);
      gasSet('du§'+sk(bName,mi,iName),dueInp.value);
      const s=dueStatus(dueInp.value);
      dueInp.setAttribute('data-status',s);
    })); }
    const payInp=tr.querySelector('#pay_'+sid);
    if(payInp){

      payInp.value=getPayDate(bName,mi,iName); ['change','input','blur'].forEach(ev=>payInp.addEventListener(ev,()=>{
      if(!payInp.value) return;
      savePayDate(bName,mi,iName,payInp.value);
      gasSet('pd§'+sk(bName,mi,iName),payInp.value);
    })); }
    const nd=tr.querySelector('#nd_'+sid), ni=tr.querySelector('#ni_'+sid);
    nd.onclick=()=>{ nd.style.display='none'; ni.style.display='block'; ni.focus(); };
    ni.onblur=()=>{ saveNote(bName,mi,iName,ni.value); nd.innerHTML=ni.value||'<span style="color:#2A4060">點擊新增…</span>'; ni.style.display='none'; nd.style.display=''; };

    tb.appendChild(tr);
  });
}

function renderOv(){
  const mi=curM, grid=document.getElementById('og'); grid.innerHTML='';
  BRANCHES.forEach(b=>{
    const s=stats(b,mi);
    const div=document.createElement('div'); div.className='bc';
    div.innerHTML=
      '<div class="bc-name">'+
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>'+
      b+'</div>'+
      '<div class="bc-pct" style="color:'+pCol(s.pct)+'">'+s.pct+'%<span class="badge '+bCls(s.pct)+'" style="font-size:10px;margin-left:4px">'+bTxt(s.pct)+'</span></div>'+
      '<div class="bc-sub">'+s.p+' / '+s.t+' 項已繳</div>'+
      '<div class="pb-wrap"><div class="pb" style="width:'+s.pct+'%;background:'+pCol(s.pct)+'"></div></div>'+
      (s.sum>0?'<div class="bc-amt">已繳 $'+s.sum.toLocaleString()+'</div>':'');
    div.onclick=()=>{ curB=b; setView('d'); renderTabs(); renderTable(); renderSm(); };
    grid.appendChild(div);
  });
}

function doExport(){
  const mi=curM; let txt='逗點教室 分校固定支出控管報告\n115年 '+MO_TXT[mi]+'\n'+'='.repeat(44)+'\n\n';
  BRANCHES.forEach(b=>{
    const s=stats(b,mi);
    txt+='【'+b+'】'+s.p+'/'+s.t+' 已繳 ('+s.pct+'%)'+(s.sum>0?' — 已繳合計 $'+s.sum.toLocaleString():'')+'\n';
    BD[b].items.forEach(it=>{
      const p=isPaid(b,mi,it.n), a=getAmt(b,mi,it.n), nt=getNote(b,mi,it.n);
      txt+='  '+(p?'✓':'✗')+' ['+it.c+'] '+it.n+(a?' $'+Number(a).toLocaleString():'')+(nt?' — '+nt:'')+'\n';
    }); txt+='\n';
  });
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));
  a.download='逗點分校繳費控管_115年'+MO_TXT[mi]+'.txt'; a.click();
}

function saveAll(){
  const btn=document.getElementById('saveBtn');
  btn.textContent='儲存中…'; btn.className='save-btn saving'; btn.disabled=true;
  const keys=Object.keys(OV);
  if(keys.length===0){ btn.textContent='✓ 無變更'; btn.className='save-btn saved'; setTimeout(()=>{ btn.textContent='儲存'; btn.className='save-btn'; btn.disabled=false; },2000); return; }
  let done=0;
  keys.forEach(k=>{
    gasSet(k, OV[k]===null?'':String(OV[k])).then(()=>{
      done++;
      if(done===keys.length){
        btn.textContent='✓ 已儲存 '+done+' 筆';
        btn.className='save-btn saved';
        setTimeout(()=>{ btn.textContent='儲存'; btn.className='save-btn'; btn.disabled=false; },3000);
      }
    }).catch(()=>{ btn.textContent='✗ 儲存失敗'; btn.className='save-btn'; btn.disabled=false; });
  });
}
function renderAlert(){
  const mi=curM;
  const box=document.getElementById('alertBox');
  const items=document.getElementById('alertItems');
  if(!box||!items) return;
  items.innerHTML='';
  let count=0;
  BRANCHES.forEach(b=>{
    BD[b].items.forEach(it=>{
      if(!isPaid(b,mi,it.n)){
        count++;
        const tag=document.createElement('span');
        tag.className='alert-tag';
        tag.textContent=b+' · '+it.n;
        tag.style.cursor='pointer';
        tag.onclick=()=>{ curB=b; renderTabs(); renderTable(); renderSm(); };
        items.appendChild(tag);
      }
    });
  });
  box.style.display=count>0?'block':'none';
}
function render(){ renderSm(); renderTabs(); renderTable(); renderAlert(); if(curV==='o') renderOv(); }
renderMsel(); document.body.insertAdjacentHTML('beforeend','<div id="ld" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;z-index:999;font-size:15px;color:#0A1628">載入資料中…</div>'); gasLoad().then(()=>{ document.getElementById('ld').remove(); render(); });
</script>
